name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A rerun must never race another publication for this tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.check.outputs.version }}
      revision: ${{ steps.check.outputs.revision }}
      transfer-sha256: ${{ steps.check.outputs.transfer-sha256 }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Includes tag refs so identity can peel/compare the tag.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - name: Require clean checked-out tag and committed release notes
        run: python -I -B tools/ci.py identity --tag "$RELEASE_TAG"
      - name: Prepare locked development dependencies (online)
        run: npm ci --prefix tests/stylus --cache "$GITHUB_WORKSPACE/.work/npm-cache" --ignore-scripts --no-audit --no-fund
      - name: Full validation and reproducibility (network namespace)
        id: check
        run: bash tools/ci.sh
      - name: Upload immutable verified bytes
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: .work/ci-bundle/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  publish:
    needs: build
    # Disabled until the operator has configured and audited environment approval.
    if: ${{ vars.RELEASE_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Operator must configure required reviewers; the name alone is NOT a gate.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download only this run's verified artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify immutable handoff and publish without rebuilding or clobbering
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REVISION: ${{ needs.build.outputs.revision }}
          TRANSFER_SHA256: ${{ needs.build.outputs.transfer-sha256 }}
        run: |
          set -euo pipefail
          printf '%s  candidate/TRANSFER.sha256\n' "$TRANSFER_SHA256" | sha256sum --check --strict
          (cd candidate && sha256sum --check --strict TRANSFER.sha256 && sha256sum --check --strict SHA256SUMS)
          # A moved/deleted tag must not publish bytes from the earlier checkout.
          remote_revision=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          test "$remote_revision" = "$REVISION"
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GH_REPO" --verify-tag --target "$REVISION" \
            --title "$TAG" --notes-file candidate/RELEASE_NOTES.md "${prerelease[@]}" \
            "candidate/achroma-$VERSION.zip" candidate/SHA256SUMS candidate/SOURCE.json
