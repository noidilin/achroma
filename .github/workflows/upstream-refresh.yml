name: Catppuccin refresh proposal

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC; avoid the top-of-hour rush.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catppuccin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'noidilin/achroma' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.17.1'
      - name: Require clean trusted source
        run: python -I -B tools/ci.py identity
      - name: Resolve revision and refresh every independent endpoint (online)
        id: refresh
        run: python -I -B tools/upstream.py prepare --candidate .work/upstream-candidate
      - name: Prepare locked development dependencies (online)
        if: steps.refresh.outputs.changed == 'true'
        run: npm ci --prefix tests/stylus --cache "$GITHUB_WORKSPACE/.work/npm-cache" --ignore-scripts --no-audit --no-fund
      - name: Record offline validation without blessing changed baselines
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p .work/home .work/tmp
          python_path=$(command -v python)
          sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env "PATH=$PATH" "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" \
            "HOME=$PWD/.work/home" "TMPDIR=$PWD/.work/tmp" \
            "$python_path" -I -B tools/upstream.py validate --candidate .work/upstream-candidate
      - name: Upload data-only proposal from this run
        if: steps.refresh.outputs.changed == 'true'
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-proposal
          path: .work/upstream-candidate/
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  propose:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.refresh.outputs.artifact-id }}
          merge-multiple: true
          path: .work/upstream-proposal
      - name: Update only the dedicated draft PR (never execute proposal data)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -I -B tools/upstream.py publish --candidate .work/upstream-proposal
